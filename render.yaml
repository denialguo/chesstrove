# Render blueprint: the ChessTrove API (api.chesstrove.tech) on Render's free web service. The site itself is
# on Vercel (web/vercel.json); the database is Supabase: set CHESSTROVE_DATABASE_URL to its Session pooler
# connection string in the dashboard. Custom domain and DNS: README, "Hosting it publicly".
services:
  - type: web
    name: chesstrove
    runtime: python
    plan: free
    region: virginia  # next to the Supabase project (us-east-1); every query crosses this link
    buildCommand: pip install uv && uv sync --frozen --no-dev
    startCommand: .venv/bin/chesstrove serve --host 0.0.0.0
    healthCheckPath: /api/detectors
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: CHESSTROVE_PUBLIC
        value: "1"
      - key: CHESSTROVE_DATABASE_URL
        sync: false
